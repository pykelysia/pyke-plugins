<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ui-draw 画板</title>
  <link rel="stylesheet" href="/board.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">🎨 ui-draw <span class="sub">协作画板</span><span id="project-chip" class="chip"></span></div>
    <div class="top-actions">
      <button id="btn-undo" title="撤销 (Ctrl+Z)">↩ 撤销</button>
      <button id="btn-redo" title="重做 (Ctrl+Y)">↪ 重做</button>
      <button id="btn-clear" title="清空当前图层">🧹 清空本层</button>
      <span class="status"><span id="conn-dot" class="dot off"></span><span id="status-text">连接中…</span></span>
    </div>
  </header>

  <aside id="toolbar">
    <button class="tool" data-tool="select" title="选择/移动 (V)">⬚</button>
    <button class="tool" data-tool="pen" title="铅笔 (P)">✏️</button>
    <button class="tool" data-tool="line" title="直线 (L)">／</button>
    <button class="tool" data-tool="rect" title="矩形 (R)">▭</button>
    <button class="tool" data-tool="ellipse" title="椭圆 (O)">◯</button>
    <button class="tool" data-tool="arrow" title="箭头 (A)">➤</button>
    <button class="tool" data-tool="text" title="文字 (T)">T</button>
    <button class="tool" data-tool="eraser" title="橡皮 (E)">🧽</button>
    <button class="tool annotate-tool" data-tool="annotate" title="批注：框选区域并写说明给 agent (N)">📝</button>
    <div class="sep"></div>
    <label class="ctl" title="笔色">笔色<input type="color" id="inp-color" value="#1f2937" /></label>
    <label class="ctl" title="粗细">粗细
      <select id="inp-width">
        <option value="1">1</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="5">5</option>
        <option value="8">8</option>
      </select>
    </label>
    <label class="ctl" title="填充色">填充<input type="color" id="inp-fill" value="#eef2ff" /></label>
    <label class="ctl checkbox" title="是否填充"><input type="checkbox" id="inp-fill-on" /> 无填充</label>
    <label class="ctl checkbox" title="虚线"><input type="checkbox" id="inp-dash" /> 虚线</label>
    <label class="ctl" title="文字字号">字号<input type="number" id="inp-size" value="16" min="8" max="120" style="width:3.2em" /></label>
  </aside>

  <main id="stage">
    <div id="canvas-wrap">
      <canvas id="board-canvas"></canvas>
      <canvas id="overlay-canvas"></canvas>
      <textarea id="text-input" spellcheck="false" placeholder="输入文字，Enter 提交"></textarea>
    </div>
    <div id="zoom-bar">
      <button id="zoom-out" title="缩小 (Ctrl+-)">−</button>
      <button id="zoom-label" title="点击恢复 100%">100%</button>
      <button id="zoom-in" title="放大 (Ctrl+=)">＋</button>
      <button id="zoom-fit" title="适应窗口 (Ctrl+0)">适应</button>
      <span class="zoom-sep"></span>
      <button id="copy-selection" title="把选中区域复制成图片，可直接粘贴到对话框 (Ctrl+Shift+C)" disabled>复制选区图</button>
      <span id="zoom-hint">滚轮缩放 · 空格/中键拖动平移</span>
    </div>
    <div id="disconnected-banner">画板服务已断开（ZCode 会话可能已结束）。恢复会话后此页会自动重连；也可以让 agent 再执行 show_board。</div>
  </main>

  <aside id="layers-panel">
    <div class="panel-title">图层 <span class="hint">（双击改名）</span></div>
    <ul id="layer-list"></ul>
    <button id="btn-add-layer">＋ 新建图层</button>
    <div class="panel-tip">当前图层：<b id="active-layer-name">—</b><br />橡皮只擦当前层</div>

    <div class="panel-title anno-title">📝 批注 <span class="hint">（点条目定位）</span></div>
    <ul id="anno-list"></ul>
    <div class="panel-tip">选「📝 批注」工具在画布上框选区域写说明；写完在对话里让 agent「按批注改」，它会读取这些说明。</div>
  </aside>

  <div id="anno-modal" class="modal hidden">
    <div class="modal-box">
      <h3>写批注给 agent</h3>
      <p id="anno-region" class="anno-region"></p>
      <textarea id="anno-text" placeholder="想让 agent 怎么改？例如：这里的按钮换成次要样式；这块需要加空状态提示。Ctrl+Enter 提交"></textarea>
      <div class="modal-actions">
        <button id="anno-cancel" class="ghost">取消</button>
        <button id="anno-submit">提交批注</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module" src="/board.js"></script>
</body>
</html>
